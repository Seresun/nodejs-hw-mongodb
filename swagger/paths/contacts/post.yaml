tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the contact list.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/Contact.yaml'
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Bad Request - Invalid input data
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 400
            message:
              type: string
              example: "Missing required field"
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 401
            message:
              type: string
              example: "Unauthorized"
