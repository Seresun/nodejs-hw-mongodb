tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve the list of all contacts. Supports filtering by favorite status.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: favorite
    schema:
      type: boolean
    description: Filter contacts by favorite status
responses:
  '200':
    description: Successful response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/Contact.yaml'
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 401
            message:
              type: string
              example: "Unauthorized"
