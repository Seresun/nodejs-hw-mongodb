tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve contact information by its unique ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Contact retrieved successfully
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 401
            message:
              type: string
              example: "Unauthorized"
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 404
            message:
              type: string
              example: "Not found"
