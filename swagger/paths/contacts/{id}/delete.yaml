tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: Delete a contact by its ID.
security:
  - bearerAuth: []
parameters:
  - name: Id
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Contact deleted"
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 401
            message:
              type: string
              example: "Unauthorized"
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 404
            message:
              type: string
              example: "Not found"
