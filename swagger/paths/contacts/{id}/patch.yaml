tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Update the details of a contact by its ID.
security:
  - bearerAuth: []
parameters:
  - name: Id
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../components/schemas/Contact.yaml'
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Bad Request - Invalid input data
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 400
            message:
              type: string
              example: "Missing required field"
  '401':
    description: Unauthorized - Authentication required
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 401
            message:
              type: string
              example: "Unauthorized"
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: "error"
            code:
              type: integer
              example: 404
            message:
              type: string
              example: "Not found"
